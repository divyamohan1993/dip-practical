name: Feature request
description: Suggest a new experiment, improvement, or enhancement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: What is the motivation?
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affects which deployment forms?
      multiple: true
      options:
        - Notebooks (Colab)
        - Flask web app (Cloud Run)
        - Static client-side build (Cloudflare Pages)
        - Printed PDF handbook
        - Documentation only
    validations:
      required: true
